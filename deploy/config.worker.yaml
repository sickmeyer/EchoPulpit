# Uploaded to S3 (app/config.yaml) and fetched by bootstrap.sh at boot.
# Differs from the repo-root config.yaml (used for local dev) only in
# output.dir, which must match bootstrap.sh's OUTPUT_ROOT.
youtube:
  channel_id: "UC2G5D6TA-ywpSJCERaAzG_Q"
  lookback_hours: 48

transcription:
  whisper_model: "medium"
  language: "en"
  vad_filter: true
  prefer_captions: true
  # Lowered from 0.85 (2026-08-17): YouTube's SABR-only rollout is now
  # blocking yt-dlp's audio download (both the cookie and android-client
  # paths -- see download_audio() in sermon_pipeline.py) often enough that
  # jobs with decent-but-not-quite-0.85 caption coverage were failing
  # outright instead of using the captions they already had. 0.75 trades a
  # bit of transcript completeness for actually finishing the job when the
  # Whisper fallback path is unreliable.
  min_caption_coverage: 0.75
  caption_langs: ["en", "en-US", "en-GB"]
  # Optional (2026-09-22): this church streams via Subsplash, whose podcast
  # feed has public MP3s with no YouTube bot checks, so audio is taken from
  # there when the stream has a matching episode, with yt-dlp as the
  # fallback. Remove these two keys for YouTube-only behavior. See
  # download_subsplash_audio() in sermon_pipeline.py. The worker re-checks
  # the feed for up to subsplash_wait_minutes in case the episode hasn't
  # been published yet when the stream ends.
  subsplash_feed_url: "https://podcasts.subsplash.com/bg23rt3/podcast.rss"
  subsplash_wait_minutes: 45

sermon_extraction:
  min_minutes: 12
  max_fraction_of_total: 0.9
  window_minutes: 12
  drop_threshold_segments: 8

llm:
  # Switched from claude-sonnet-5 on 2026-09-23 after a blind side-by-side
  # on three sermons. ~4x the cost per article (~$0.35-0.70 vs ~$0.14).
  claude_model: "claude-opus-5-5"
  style_guide_path: "prompts/style_guide.md"
  # No model_path: the worker never installs llama-cpp-python (see
  # requirements-worker.txt), so this path is intentionally left unset --
  # ANTHROPIC_API_KEY is always present in production (Secrets Manager), so
  # build_backend() always takes the Claude path and init_llm() never runs.
  #
  # Thinking tokens count against the output ceiling. Opus 5.5 at medium
  # effort used all of a 16000 budget on thinking for 2 of 3 sermons (no
  # article) and needed 25-31K to finish, so every Claude call -- including
  # the repair/regenerate passes -- uses claude_max_tokens (requests are
  # streamed; billing is by tokens actually used). max_tokens is only the
  # local-model setting.
  claude_max_tokens: 48000
  max_tokens: 16000
  thinking_effort: "medium"

output:
  dir: "/data/output"
